name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]  # requires-python is >=3.12; 3.11 is not supported
    env:
      GEMINI_API_KEY: ""  # the suite is offline; no secret is used
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Import check
        run: python -c "import portfolioiq, portfolioiq_eval, portfolioiq.agent, portfolioiq.cli"
      - name: Check dependencies
        run: python -m pip check
      - name: Offline test suite
        run: python -m pytest -q
      - name: Data integrity
        run: python -m portfolioiq integrity
      - name: Independent financial verification against the supplied CSVs
        run: python scripts/run_independent_verification.py
      - name: Frozen baseline and security manifest
        run: python scripts/snapshot_baseline.py --check
      - name: Recorded receipts reproduce offline
        run: python -m portfolioiq_eval official --replay-check --runs-dir reports/sprint_v2_3/candidate/runs
