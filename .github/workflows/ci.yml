name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GEMINI_API_KEY: ""  # the suite is offline; no secret is used
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Offline test suite
        run: python -m pytest -q
      - name: Data integrity
        run: python -m portfolioiq integrity
      - name: Frozen baseline and security manifest
        run: python scripts/snapshot_baseline.py --check
      - name: Recorded receipts reproduce offline
        run: python -m portfolioiq_eval official --replay-check --runs-dir reports/sprint_v2_3/candidate/runs
