[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolioiq"
version = "1.0.0"
description = "PortfolioIQ: portfolio intelligence with text-to-SQL, sector exposure and an evaluation framework"
requires-python = ">=3.12"

[project.scripts]
portfolioiq = "portfolioiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
